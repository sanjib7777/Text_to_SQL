services:
  redis:
    image: redis:7.4-alpine
    container_name: txttosql-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.12.6
    container_name: txttosql-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: txttosql-postgres
    environment:
      POSTGRES_DB: ai_report_assistant
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_report_assistant"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: txttosql-oracle
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: suyog
      APP_USER_PASSWORD: suyogTest
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
      - ./oracle/seed:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    restart: unless-stopped

volumes:
  redis-data:
  qdrant-data:
  postgres-data:
  oracle-data:
